name: "Build Python Wheel on Windows"

on: [push, pull_request, workflow_call]

env:
  python_version_build: "3.14"
  python_version_test: "3.12"

jobs:
  build_wheels:
    name: Build Windows Wheel using Intel oneAPI Fortran Compiler (ifort)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7
      
      - name: Find Visual Studio
        shell: cmd
        run: |  
          set VS_PATH=
          for /f "usebackq tokens=*" %%i in (
            `"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`
          ) do set VS_PATH=%%i

          if "%VS_PATH%"=="" (
            echo ERROR: Visual Studio not found
            exit /b 1
          )
          echo Found VS at: %VS_PATH%
          echo VS_PATH=%VS_PATH%>>%GITHUB_ENV%

      # Semi-official action to install Fortran compilers
      # https://github.com/marketplace/actions/setup-fortran
      - name: Install Intel oneAPI Fortran Compiler (ifx)
        id: setup-fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: "2025.2"

      - name: Compile the SWD Fortran library
        shell: cmd
        run: |
          REM Initialize the Visual Studio environment
          echo Using Visual Studio from: %VS_PATH%
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64

          ECHO ..... Test the environment - CC .....................................................
          set CC=icx
          where %CC%
          %CC%
          ECHO IGNORE warning about missing input files above (we just want the version number)
          ECHO:

          ECHO ..... Test the environment - FC .....................................................
          set FC=ifx
          where %FC%
          %FC%
          ECHO IGNORE warning about missing input files above (we just want the version number)
          ECHO:

          ECHO ..... Test the environment - ninja ..................................................
          where ninja
          ninja --version
          ECHO:

          ECHO ..... Test the environment - cmake ..................................................
          where cmake
          cmake --version
          ECHO:

          ECHO .....................................................................................
          ECHO ..... Prepare the build directory  ..................................................
          CD src\api\python\Cmake
          DIR
          MKDIR Build_Win64

          ECHO .....................................................................................
          ECHO ..... CMake: Generate the Visual Studio build files .................................
          REM   For some reason, using the /MT flag (or CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          REM   causes the build to statically link the Fortran runtime libraries ...?? We want
          REM   this so that the resulting wheel does not require the Intel Fortran libraries
          cmake ^
            -G "Ninja" ^
            -DCMAKE_C_COMPILER=icx ^
            -DCMAKE_Fortran_COMPILER=ifx ^
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=TRUE ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_BUILD_TYPE=Release ^
            -S . -B Build_Win64
          IF %ERRORLEVEL% NEQ 0 (
            ECHO Error occurred during CMake build generation
            GOTO :on_error
          )

          ECHO .....................................................................................
          ECHO ..... CMake: Compile using the Release configuration ................................
          cmake --build Build_Win64 --verbose
          IF %ERRORLEVEL% NEQ 0 (
            ECHO Error occurred during CMake build compilation
            GOTO :on_error
          )

          ECHO .....................................................................................
          ECHO ..... List the resulting build files ................................................
          DIR Build_Win64\Release

          EXIT /B 0

          :on_error
          ECHO An error occurred during the build process
          EXIT /B 1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"  # Latest version of uv at time of commit, from 2026-06-26
          python-version: ${{ env.python_version_build }}
          enable-cache: true

      - name: Build wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd src\api\python

          # Create the wheel file (can also use "pip wheel .")
          # The file ends up in the "dist" directory
          Write-Output "`n`n---------------------------------------------`n-- uv build --wheel `n"
          uv build --wheel

          # Show the contents of the dist directory (should contain the wheel file)
          Write-Output "`n`n---------------------------------------------`n-- Contents of dist/ `n"
          Get-ChildItem -Path dist -Recurse -Force

          # Store path to the wheel file in an environment variable for later steps
          Write-Output "`n`n---------------------------------------------`n-- Path to *.whl `n"
          $wheel = Get-ChildItem -Path dist\*.whl | Select-Object -Expand FullName
          Write-Output "Found wheel file at: $wheel"
          Write-Output "WHEEL_FILE=$wheel" >> $env:GITHUB_ENV

          # List the contents of the wheel file
          # (A wheel is a zip file and we load and then use a .NET function to list its contents)
          Write-Output "`n`n---------------------------------------------`n-- Contents of whl `n"
          [Reflection.Assembly]::LoadWithPartialName('System.IO.Compression.FileSystem')
          [IO.Compression.ZipFile]::OpenRead($wheel).Entries.FullName |
            ForEach-Object { Write-Output "File inside wheel: $_" }

      - name: Install the wheel for testing
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd tests\python

          # Create a virtual environment with the oldest supported Python version
          Write-Output "`n`n---------------------------------------------`n-- uv venv `n"
          uv venv .venv --clear --no-project --seed --python ${{ env.python_version_test }}
          .\.venv\Scripts\Activate.ps1

          # Install the test dependencies and then the newly built wheel file
          Write-Output "`n`n---------------------------------------------`n-- pip install `n"
          pip install -r requirements_tests.txt
          pip install $env:WHEEL_FILE

          # Debug: show the installation information with console scripts
          Write-Output "`n`n---------------------------------------------`n-- pip show `n"
          pip show --verbose spectral_wave_data
          Get-ChildItem -Path .venv\Scripts -Recurse -Force

          # Debug: show the contents of the site-packages directory
          Write-Output "`n`n---------------------------------------------`n-- dumpbin `n"
          Get-ChildItem -Path .venv\Lib\site-packages\spectral_wave_data* -Force

          # Debug: show the installed package version
          Write-Output "`n`n---------------------------------------------`n-- SWD version `n"
          python -c "import spectral_wave_data; print(spectral_wave_data.version_full)"
          swd_meta --version

      - name: Show DLL debug info of the installed wheel
        shell: cmd
        run: |
          REM Load the Visual Studio environment variables so that dumpbin can be found
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64

          REM Show information about the newly built DLL that should be inside the installed wheel
          cd tests\python
          dumpbin /dependents .venv\Lib\site-packages\spectral_wave_data\SpectralWaveData.dll

      - name: Build and run Fortran FFT unit tests
        shell: cmd
        run: |
          cd tests\fortran\fft\Cmake
          cmake -B build -DCMAKE_BUILD_TYPE=Release .
          cmake --build build --config Release
          cd build && ctest -C Release --output-on-failure

      - name: Test the installed wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # Activate the virtual environment created above
          Write-Output "`n`n---------------------------------------------`n-- activate venv `n"
          cd tests\python
          .\.venv\Scripts\Activate.ps1

          # Run a subset of the tests to verify that the wheel is functional
          Write-Output "`n`n---------------------------------------------`n-- pytest `n"
          $env:SWD_TEST_TYPE="quick"
          python -m pytest -v

      - name: Upload the newly built Python wheel for win_amd64 to GitHub artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python_wheel_for_win_amd64
          path: ${{ env.WHEEL_FILE }}
