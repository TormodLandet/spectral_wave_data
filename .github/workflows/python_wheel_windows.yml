name: "Build Python Wheel on Windows"

on: [push, pull_request]

env:
  python_version_build: "3.13"
  python_version_test: "3.10"

jobs:
  build_wheels:
    name: Build Windows Wheel using Intel oneAPI Fortran Compiler (ifort)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Our own action to install Intel oneAPI Fortran Compiler (ifx)
      - name: Install Intel oneAPI Fortran Compiler (ifx)
        id: install-ifx
        uses: ./.github/actions/windows_install_ifx

      # Semi-official action to install Fortran compilers
      # https://github.com/marketplace/actions/setup-fortran
      #- name: Install Intel oneAPI Fortran Compiler (ifx)
      #  id: setup-fortran
      #  uses: fortran-lang/setup-fortran@v1
      #  with:
      #    compiler: intel
      #    version: "2025.0"

      - name: Compile the SWD Fortran library
        shell: cmd
        run: |
          REM Required when using our own "install-ifx" action above, not when using
          REM the semi-official "setup-fortran" action
          ECHO .....................................................................................
          ECHO ..... Setup the environment for Intel oneAPI  .......................................
          CALL "${{ steps.install-ifx.outputs.install_dir }}\setvars.bat"

          ECHO .....................................................................................
          ECHO ..... Test the environment - cl .....................................................
          where cl
          cl
          ECHO:

          ECHO ..... Test the environment - ifx ....................................................
          where ifx
          ifx --version
          ECHO:

          ECHO ..... Test the environment - ninja ..................................................
          where ninja
          ninja --version
          ECHO:

          ECHO ..... Test the environment - cmake ..................................................
          where cmake
          cmake --version
          ECHO:

          ECHO ..... Test the environment - FC full path ...........................................
          echo FC=%FC%
          FOR /F "delims=" %%i IN ('where %FC%') DO SET "FC_PATH=%%i"
          IF NOT DEFINED FC_PATH (
              ECHO Error: Fortran compiler %FC% not found in PATH
              EXIT /B 1
          )
          ECHO Found Fortran compiler at: "%FC_PATH:\=\\%"
          ECHO:

          ECHO ..... Test the environment - CC full path ...........................................
          echo CC=%CC%
          FOR /F "delims=" %%i IN ('where %CC%') DO SET "CC_PATH=%%i"
          IF NOT DEFINED CC_PATH (
              ECHO Error: C compiler %CC% not found in PATH
              EXIT /B 1
          )
          ECHO Found C compiler at: "%CC_PATH:\=\\%"
          ECHO:

          ECHO .....................................................................................
          ECHO ..... Prepare the build directory  ..................................................
          CD src\api\python\Cmake
          DIR
          MKDIR Build_Win64
          
          ECHO .....................................................................................
          ECHO ..... CMake: Generate the Visual Studio build files .................................
          cmake -G "Ninja" ^
            -DCMAKE_C_COMPILER="%CC_PATH:\=\\%" ^
            -DCMAKE_Fortran_COMPILER="%FC_PATH:\=\\%" ^
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=TRUE ^
            -DCMAKE_BUILD_TYPE=Release ^
            -S . -B Build_Win64
          IF %ERRORLEVEL% NEQ 0 (
            ECHO Error occurred during CMake build generation
            GOTO :on_error
          )

          ECHO .....................................................................................
          ECHO ..... CMake: Compile using the Release configuration ................................
          cmake --build Build_Win64 --config Release
          IF %ERRORLEVEL% NEQ 0 (
            ECHO Error occurred during CMake build compilation
            GOTO :on_error
          )

          ECHO .....................................................................................
          ECHO ..... List the resulting build files ................................................
          DIR Build_Win64/Release

          EXIT /B 0

          :on_error
          ECHO An error occurred during the build process
          EXIT /B 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          python-version: ${{ env.python_version_build }}
          enable-cache: true

      - name: Build wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd src\api\python

          # Install auditwheel and any other dependencies
          uv sync --only-group=build

          # Create the wheel file (can also use "pip wheel .")
          # The file ends up in the "dist" directory
          uv build --wheel

          Get-ChildItem -Path dist -Recurse -Force

      - name: Install the wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd tests\python
          dir ..\..\src\api\python\dist
          $wheel = Get-ChildItem -Path ..\..\src\api\python\dist\spectral_wave_data-*.whl |
            Select-Object -Expand FullName
          Write-Host "Found wheel file name: $wheel"

          # Create a virtual environment with the oldest supported Python version
          uv venv .venv --clear --no-project --seed --python ${{ env.python_version_test }}
          .\.venv\Scripts\Activate.ps1

          # Install the test dependencies and then the newly built manylinux wheel
          pip install -r requirements_tests.txt
          pip install $wheel

          # Show the installation information with console scripts
          pip show --verbose spectral_wave_data
          Get-ChildItem -Path .venv\Scripts -Recurse -Force

          # Show the installed package version
          python -c "import spectral_wave_data; print(spectral_wave_data.version_full)"
          swd_meta --version

      - name: Test the wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd tests\python
          .\.venv\Scripts\Activate.ps1

          # Run a subset of the tests to verify that the wheel is functional
          $env:SWD_TEST_TYPE="quick"
          python -m pytest -v

      - name: Upload Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-win64
          path: src/api/python/dist
