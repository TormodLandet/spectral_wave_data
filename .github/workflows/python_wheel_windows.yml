name: "Build Python Wheel on Windows"

on: [push, pull_request]

env:
  oneAPI_download_path: "b00ef14b-e999-414f-8649-cf5ac754eafc/intel-fortran-essentials-2025.2.0.510_offline.exe"
  oneAPI_download_dir: "D:\\MyOneAPI\\downloads"
  oneAPI_log_dir: "D:\\MyOneAPI\\installer_logs"
  oneAPI_extract_dir: "D:\\MyOneAPI\\extracted"
  oneAPI_install_dir: "D:\\MyOneAPI\\install"
  python_version_build: "3.13"
  python_version_test: "3.10"

jobs:
  build_wheels:
    name: Build Windows Wheel using Intel oneAPI Fortran Compiler (ifort)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # We cache the Intel oneAPI instalaltion directory, it can take a looong time
      # to download and install it, especially on the C: drive, D: drive is faster
      # - Downloading the installer takes about 20 seconds
      # - Running the installer takes about 15 minutes !!! (on the C: drive, 12-14 on the D: drive)
      - name: Try to load the oneAPI Fortran Compiler installation from cache
        id: cache-oneAPI-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.oneAPI_install_dir }}
          # The key can be anything, but must change if the contents of the directory changes
          key: path=${{ env.oneAPI_install_dir }};version=${{ env.oneAPI_download_path }}

      - name: Make oneAPI installation directory structure (if not allready installed)
        if: steps.cache-oneAPI-restore.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # Create directories for the OneAPI installation
          # (Installer seems to fail silently if some of these directories are missing)
          New-Item -Path '${{ env.oneAPI_download_dir }}' -ItemType Directory -Force
          New-Item -Path '${{ env.oneAPI_log_dir }}'      -ItemType Directory -Force
          New-Item -Path '${{ env.oneAPI_extract_dir }}'  -ItemType Directory -Force
          New-Item -Path '${{ env.oneAPI_install_dir }}'  -ItemType Directory -Force
          
          Get-ChildItem -Path '${{ env.oneAPI_install_dir }}\..' -Recurse -Force

      - name: Download the Intel oneAPI Fortran Compiler (if not allready installed)
        if: steps.cache-oneAPI-restore.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: ${{ env.oneAPI_download_dir }}
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $downloadUrl = 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/${{ env.oneAPI_download_path }}'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $downloadUrl -OutFile '${{ env.oneAPI_download_dir }}\intel-fortran-installer.exe'

          # Show the download's folder
          Get-ChildItem -Path '${{ env.oneAPI_download_dir }}' -Recurse -Force

      - name: Install the Intel oneAPI Fortran Compiler (if not allready installed)
        if: steps.cache-oneAPI-restore.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{ env.oneAPI_download_dir }}
        run: |
          ECHO Loading Visual Studio environment variables
          CALL "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64

          ECHO .....................................................................................
          ECHO ..... Listing Intel oneAPI installer ................................................
          TIME /T
          .\intel-fortran-installer.exe -s -a --list-products
          TIME /T

          ECHO .....................................................................................
          ECHO ..... Running Intel oneAPI installer ................................................
          TIME /T
          .\intel-fortran-installer.exe ^
            --log "${{ env.oneAPI_log_dir }}\installer_extraction.log" ^
            --extract-folder "${{ env.oneAPI_extract_dir }}" ^
            -s -a --silent --eula accept ^
            --install-dir "${{ env.oneAPI_install_dir }}" ^
            --log-dir "${{ env.oneAPI_log_dir }}"
          TIME /T
          ECHO "............. DONE! ......................"

          SET INSTALLER_ERROR_CODE=%ERRORLEVEL%
          IF %INSTALLER_ERROR_CODE% NEQ 0 (
            ECHO "ERROR occurred in Intel oneAPI Fortran Compiler installation!"
          ) ELSE (
            ECHO "Intel oneAPI Fortran Compiler installation completed successfully"
          )

          ECHO .....................................................................................
          ECHO ..... The top-level log is found below ..............................................
          ECHO .....................................................................................
          TYPE "${{ env.oneAPI_log_dir }}\installer_extraction.log"
          ECHO .....................................................................................

          EXIT /B %INSTALLER_ERROR_CODE%

      - name: Save the Intel oneAPI Fortran Compiler installation to cache
        id: cache-oneAPI-save
        uses: actions/cache/save@v4
        # Below info is copy of the previous cache step configuration
        with:
          path: ${{ env.oneAPI_install_dir }}
          key: ${{ steps.cache-oneAPI-restore.outputs.cache-primary-key }}

      - name: Debug Intel oneAPI installation location
        shell: cmd
        run: |
          ECHO .....................................................................................
          DIR /S "${{ env.oneAPI_install_dir }}"
          ECHO .....................................................................................

          ECHO .....................................................................................
          DIR /S "C:\Program Files (x86)\Intel"
          ECHO .....................................................................................

      - name: Compile the SWD Fortran library
        shell: cmd
        run: |
          ECHO .....................................................................................
          ECHO ..... Setup the environment for Intel oneAPI  .......................................
          CALL "${{ env.oneAPI_install_dir }}\setvars.bat" --force

          ECHO .....................................................................................
          ECHO ..... Test the environment ..........................................................
          cl --version
          ifx --version

          set "path_ifx=${{ env.oneAPI_install_dir }}\compiler\latest\bin\ifx.exe"
          set "path_ifx2=%path_ifx:\=/%"
          %path_ifx2% --version

          CD src\api\python\Cmake
          RMDIR /s /q Build_Win64
          MKDIR Build_Win64
          CD Build_Win64

          ECHO .....................................................................................
          ECHO ..... CMake: Generate the Visual Studio build files .................................
          cmake -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=TRUE ^
            -DCMAKE_Fortran_COMPILER="%path_ifx2%" ^
            -T fortran=ifx ^
            ..
          IF %ERRORLEVEL% NEQ 0 (
            ECHO Error occurred during CMake build generation
            GOTO :on_error
          )

          ECHO .....................................................................................
          ECHO ..... CMake: Compile using the Release configuration ................................
          cmake --build . --config Release
          IF %ERRORLEVEL% NEQ 0 (
            ECHO Error occurred during CMake build compilation
            GOTO :on_error
          )

          ECHO .....................................................................................
          ECHO ..... Debug: List the generated files ...............................................
          DIR /S

          EXIT /B 0

          :on_error
          ECHO An error occurred during the build process
          EXIT /B 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          python-version: ${{ env.python_version_build }}
          enable-cache: true

      - name: Build wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd src\api\python

          # Install auditwheel and any other dependencies
          uv sync --only-group=build

          # Create the wheel file (can also use "pip wheel .")
          # The file ends up in the "dist" directory
          uv build --wheel

          Get-ChildItem -Path dist -Recurse -Force

      - name: Install the wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd tests\python

          # Create a virtual environment with the oldest supported Python version
          uv venv .venv --clear --no-project --seed --python ${{ env.python_version_test }}
          .\.venv\Scripts\Activate.ps1

          # Install the test dependencies and then the newly built manylinux wheel
          pip install -r requirements_tests.txt
          pip install ..\..\src\api\python\dist\spectral_wave_data*.whl

          # Show the installation information with console scripts
          pip show --verbose spectral_wave_data
          Get-ChildItem -Path .venv\Scripts -Recurse -Force

          # Show the installed package version
          python -c "import spectral_wave_data; print(spectral_wave_data.version_full)"
          swd_meta --version

      - name: Test the wheel
        shell: powershell
        run: |
          # Stop the script when a cmdlet or a native command fails
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cd tests\python
          .\.venv\Scripts\Activate.ps1

          # Run a subset of the tests to verify that the wheel is functional
          $env:SWD_TEST_TYPE="quick"
          python -m pytest -v

      - name: Upload Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-win64
          path: src/api/python/dist
