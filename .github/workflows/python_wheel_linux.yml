name: "Build Python Wheel on Linux"

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build oldest supported manylinux wheel
    runs-on: ubuntu-latest
    #container: quay.io/pypa/manylinux2014_x86_64  # Fails to run on GitHub Actions
    container: quay.io/pypa/manylinux_2_28_x86_64  # GCC version 14, Redhat 8 / Ubuntu 18.10
    
    steps:
      - uses: actions/checkout@v4

      - name: Compile the SWD Fortran library
        run: |
          cd src/api/python/Cmake
          bash ./CMakeBuild_Linux.bash

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          python-version: 3.13
          enable-cache: true

      - name: Build wheel
        run: |
          cd src/api/python

          # Install auditwheel and any other dependencies
          uv sync --only-group=build

          # Create the wheel file (can also use "pip wheel .")
          # The file ends up in the "dist/" directory
          uv build --wheel

      - name: Auditwheel repair
        run: |
          cd src/api/python

          # Show the minimum manylinux tag on this system
          uv run auditwheel show dist/*.whl

          # Make the manylinux wheel
          # The file ends up in the "wheelhouse/" directory
          uv run auditwheel repair dist/*.whl

      - name: Install the wheel and run some quick unit tests
        run: |
          cd tests/python
          uv venv .venv

          uv pip install --python .venv/bin/python \
            numpy sympy pytest ../../src/api/python/wheelhouse/spectral_wave_data*.whl

          export SWD_TEST_TYPE=quick
          .venv/bin/python -m pytest -k shape2 -v

      - name: Upload Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-manylinux
          path: src/api/python/wheelhouse
