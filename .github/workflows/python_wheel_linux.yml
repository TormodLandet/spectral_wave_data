name: "Build Python Wheel on Linux"

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ]
  
    steps:
      - uses: actions/checkout@v4

      - name: Install the build toolchain
        run: |
          sudo apt update
          sudo apt install -y cmake gfortran
  
      - name: Build the SWD shared library
        run: |
          cd src/api/python/Cmake
          rm -rf Build_Linux
          mkdir Build_Linux
          cd Build_Linux
          cmake -DCMAKE_Fortran_COMPILER=gfortran-10 -DSTATIC=OFF ..
          make

      - name: Prepare the Python sources
        run: |
          cd src/api/python/distribution
  
          cp -rv ../spectral_wave_data .
          cp -rv ../Cmake/Build_Linux/* spectral_wave_data/.
          cp -v ../../c/spectral_wave_data.h spectral_wave_data/.
          cp -v ../../../../icons/SWD_logo.ico spectral_wave_data/.

          cp -v LICENSE.txt spectral_wave_data/.
          cp -v README.txt spectral_wave_data/.

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          python-version: 3.13
          enable-cache: true

      - name: Build wheel
        run: |
          cd src/api/python/distribution

          uv sync --only-group=build
          uv build --wheel

          mkdir wheelhouse
          uv run auditwheel repair dist/*.whl

      - name: Upload Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ runner.os }}
          path: src/api/python/distribution/wheelhouse
