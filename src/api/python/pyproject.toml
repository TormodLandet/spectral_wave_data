[project]
name = "spectral_wave_data"
description = "An API for ocean wave kinematics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Jens B. Helmers, DNV", email = "Jens.Bloch.Helmers@dnvgl.com" },
    { name = "Odin Gramstad, DNV"}
]
maintainers = [
    { name = "Jens B. Helmers, DNV", email = "Jens.Bloch.Helmers@dnvgl.com" },
    { name = "Odin Gramstad, DNV"}
]
keywords = ["SWD", "API", "ocean", "wave", "kinematics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://spectral-wave-data.readthedocs.io/"
Documentation = "https://spectral-wave-data.readthedocs.io/"
Source = "https://github.com/SpectralWaveData/spectral_wave_data"

[project.scripts]
swd_meta = "spectral_wave_data.scripts.swd_meta:main"

[project.optional-dependencies]
tools = [
    # Numpy is required by spectral_wave_data.tools.airy
    "numpy",
]

[dependency-groups]
test = [
    "pytest >= 8.0",
    "numpy >= 2.0",
    "sympy >= 1.0",
]
docs = [
    # Dependencies required to build the documentation
    "sphinx >= 8.0",
    "sphinxcontrib.bibtex >= 2.0",
]
build = [
    "cmake >= 4.0",
    "auditwheel >= 6.0; sys_platform=='linux'",
    "patchelf >= 0.17; sys_platform=='linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["spectral_wave_data"]

# Include the custom plugin to get the library version
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

# Include the custom plugin to bundle the *.dll/*.so library
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# These groups are included by uv by default (for developers)
# You can use uv overrides --no-group=test or --only-group=build etc
default-groups = ["test", "docs", "build"]
